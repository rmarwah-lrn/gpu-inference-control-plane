server:
  persistentVolume:
    enabled: false
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s

extraScrapeConfigs: |
  - job_name: keda
    static_configs:
      - targets:
          - keda-operator.keda.svc.cluster.local:8080
  - job_name: hami
    static_configs:
      - targets:
          - hami-device-plugin-monitor.kube-system.svc.cluster.local:31992
          - hami-scheduler.kube-system.svc.cluster.local:31993
  - job_name: class10-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - orch-serve.default.svc.cluster.local:8080
  - job_name: class10-vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-prefill.default.svc.cluster.local:8000
          - vllm-decode.default.svc.cluster.local:8000
  - job_name: class10-mooncake
    metrics_path: /metrics
    static_configs:
      - targets:
          - mooncake-store.default.svc.cluster.local:50051
  - job_name: class10-dcgm
    metrics_path: /metrics
    static_configs:
      - targets:
          - dcgm-exporter.monitoring.svc.cluster.local:9400

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true
prometheus-pushgateway:
  enabled: false
